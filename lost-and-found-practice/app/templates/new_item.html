{% extends "base.html" %}
{% block title %}습득물 등록 | 찾아드림{% endblock %}
{% block content %}<section class="form-wrap"><p>NEW ITEM</p><h1>습득물 등록</h1><form method="post" action="/items"><label>물건 이름<input name="name" required placeholder="예: 검은색 지갑"></label><label>분류<select name="category"><option>전자기기</option><option>지갑·카드</option><option>의류·잡화</option><option>책·문구</option><option>기타</option></select></label><label>습득 장소<input name="found_location" required placeholder="예: 중앙도서관 2층"></label><label>습득 날짜<input type="date" name="found_date" value="{{ today }}" required></label><label>보관 장소<input name="storage_location" required placeholder="예: 학생지원팀 안내데스크"></label><label>상세 설명<textarea name="description" rows="4" placeholder="색상, 특징 등을 적어 주세요."></textarea></label><button class="button" type="submit">등록하기</button></form></section>{% endblock %}
